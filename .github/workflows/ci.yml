name: FlowSync Enterprise Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Backend Dependencies & Run Tests
        run: |
          cd backend
          npm install
          npm test

      - name: Install Frontend Dependencies & Build Production Bundle
        run: |
          cd frontend
          npm install
          npm run build
